[package]
name = "ts-borrow-checker"
version = "0.1.0"
edition = "2024"
description = "Ownership and resource-lifetime checks for TypeScript and JavaScript"
license = "MIT"
rust-version = "1.85"
authors = ["tsborrow contributors"]
repository = "https://github.com/orYoffe/tsborrow"
homepage = "https://github.com/orYoffe/tsborrow"
readme = "README.md"
keywords = ["typescript", "javascript", "borrow", "resources", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "benches/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "ts_borrow_checker"
path = "src/lib.rs"

[[bin]]
name = "tsborrow"
path = "src/main.rs"

[[bench]]
name = "analyzer"
harness = false

[lints.rust]
unsafe_code = "forbid"

