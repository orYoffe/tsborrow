name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the reusable action reports fixture failures
        id: borrowcheck
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/use-after-move.ts
      - name: Assert the action failed as expected
        shell: bash
        run: test "${{ steps.borrowcheck.outcome }}" = "failure"
